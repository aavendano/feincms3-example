{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filesystem articles · React Admin</title>
<style>body { margin:0; background:#f9fafb; }</style>
</head>
<body>
{% comment %}
  Standalone host for the editor module, used only when the installed
  django-admin-react has no CUSTOM_PAGES support. With it, the same module
  is mounted natively inside the SPA at the same URL.
{% endcomment %}
<div id="app"></div>
<script type="module">
  import { mount } from "{% static 'content/article-editor.js' %}";
  mount(document.getElementById("app"), { embedded: false });
</script>
</body>
</html>
